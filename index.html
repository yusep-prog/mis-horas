<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Horas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7684;--ac:#1f7a5a;--acx:#fff;--bd:#e1e6ec;--dg:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111519;--card:#1b2128;--tx:#eef2f6;--mut:#93a0ae;--ac:#3fb68b;--acx:#08140f;--bd:#2b333c;--dg:#ef7b6e}}
:root[data-theme="dark"]{--bg:#111519;--card:#1b2128;--tx:#eef2f6;--mut:#93a0ae;--ac:#3fb68b;--acx:#08140f;--bd:#2b333c;--dg:#ef7b6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.8rem;color:var(--mut);margin:0 0 4px}
input{width:100%;font-size:1.1rem;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font-size:1rem;border:0;border-radius:10px;padding:12px;cursor:pointer}
.main{width:100%;background:var(--ac);color:var(--acx);font-weight:600;margin-top:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 14px}
.nav span{font-weight:600;font-size:.95rem;text-align:center}
.day{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.day:first-of-type{border-top:0}
.day b{display:block}.day small{color:var(--mut)}
.day .r{text-align:right}
.day .x{background:none;color:var(--dg);padding:4px 8px;font-size:1.1rem}
.zero{color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;border-top:2px solid var(--ac);padding-top:10px;margin-top:6px}
.tot em{font-style:normal;color:var(--ac)}
.msg{font-size:.85rem;color:var(--ac);min-height:1.1em;margin-top:8px;text-align:center}
h2{font-size:1.05rem;margin:0 0 12px}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum>div{flex:1;background:var(--bg);border-radius:10px;padding:10px 6px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:.72rem;margin-bottom:3px}
.sum b{font-size:.95rem}
.sum .ac{color:var(--ac)}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:1rem;color:var(--tx)}
.chk input{width:22px;height:22px;flex:none}
textarea{width:100%;height:90px;font-size:.8rem;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea[hidden]{display:none}
.top{display:flex;align-items:center;justify-content:space-between;position:relative}
.top h1{flex:1}
.mb{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:1.4rem;line-height:1;padding:6px 14px;border-radius:10px}
.mn{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;z-index:50;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mn button{display:block;width:100%;text-align:left;background:none;color:var(--tx);padding:12px;border-radius:8px}
.mn button.on{background:var(--bg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;border-radius:20px;font-size:.9rem}
.chips button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">⏱️ Mis Horas de Trabajo</h1>
<div><button class="mb" id="mb" aria-label="Menú">⋮</button><div class="mn" id="mn" hidden>
<button data-v="v1">⏱️ Horas y pagos</button><button data-v="v2">💸 Gastos</button><button data-v="v3">🛟 Copia de seguridad</button></div></div></div>
<div id="v1">

<div class="card">
  <div class="row">
    <div><label for="f">Día</label><input type="date" id="f"></div>
    <div><label for="h">Horas</label><input type="number" id="h" inputmode="decimal" step="0.25" min="0" placeholder="6"></div>
  </div>
  <label class="chk" for="rest"><input type="checkbox" id="rest"> 😴 Día de descanso</label>
  <div style="margin-top:10px"><label for="v">Valor por hora ($)</label><input type="number" id="v" inputmode="numeric" min="0"></div>
  <button class="main" id="g">Guardar horas</button>
  <button class="main" id="gd" hidden style="background:none;color:var(--dg);border:1px solid var(--dg)">🗑️ Borrar este día</button>
  <div class="msg" id="m"></div>
</div>

<div class="card">
  <div class="nav"><button id="a">◀</button><span id="t"></span><button id="s">▶</button></div>
  <div style="font-size:.78rem;color:var(--mut);margin:-2px 0 6px;text-align:center">Toca un día para registrarlo o editarlo</div>
  <div id="l"></div>
  <div class="tot"><span id="th"></span><em id="tm"></em></div>
</div>

<div class="card">
  <h2>💰 Pagos</h2>
  <div class="sum">
    <div><small>Ganado</small><b id="ge"></b></div>
    <div><small>Pagado</small><b id="gp"></b></div>
    <div><small id="gl">Te deben</small><b id="gs" class="ac"></b></div>
  </div>
  <div class="row">
    <div><label for="pf">Fecha del pago</label><input type="date" id="pf"></div>
    <div><label for="pm">Monto ($)</label><input type="number" id="pm" inputmode="numeric" min="0" placeholder="100000"></div>
  </div>
  <button class="main" id="pg">Registrar pago</button>
  <div class="msg" id="pmsg"></div>
  <div id="pl"></div>
</div>
</div>

<div id="v2" hidden>
<div class="card">
  <div class="sum">
    <div><small>Pagado (total)</small><b id="xp"></b></div>
    <div><small>Gastado (total)</small><b id="xg"></b></div>
    <div><small id="xl">Te queda</small><b id="xd" class="ac"></b></div>
  </div>
  <div class="row">
    <div><label for="ef">Fecha</label><input type="date" id="ef"></div>
    <div><label for="em">Monto ($)</label><input type="number" id="em" inputmode="numeric" min="0" placeholder="15000"></div>
  </div>
  <div style="margin-top:10px"><label for="en">Nota (opcional)</label><input type="text" id="en" placeholder="Ej: almuerzo"></div>
  <div style="margin-top:12px"><label>Categoría</label><div class="chips" id="ec"></div></div>
  <button class="main" id="eg">Guardar gasto</button>
  <div class="msg" id="emsg"></div>
</div>
<div class="card">
  <div class="nav"><button id="ea">◀</button><span id="et"></span><button id="es">▶</button></div>
  <div id="el"></div>
  <div class="tot"><span>Gastado en el mes</span><em id="emt"></em></div>
</div>
</div>

<div id="v3" hidden>

<div class="card">
  <h2>🛟 Copia de seguridad</h2>
  <div class="msg" id="bage" style="margin:0 0 10px;font-weight:600"></div>
  <button class="main" id="bf" style="margin:0 0 10px">💾 Guardar copia en mi teléfono</button>
  <label class="main" for="bfile" style="display:block;text-align:center;margin:0 0 16px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:12px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer">📂 Restaurar desde archivo</label>
  <input type="file" id="bfile" accept=".json,application/json,text/plain" hidden>
  <div style="font-size:.78rem;color:var(--mut);margin-bottom:8px">Otra opción, en texto:</div>
  <div class="row">
    <button class="main" id="bk" style="flex:1;margin:0">Crear copia</button>
    <button class="main" id="rs" style="flex:1;margin:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)">Restaurar</button>
  </div>
  <textarea id="bt" hidden placeholder="Aquí aparece tu copia. Para restaurar, pega aquí el texto y toca Restaurar."></textarea>
  <div class="msg" id="bmsg"></div>
</div>

</div>

<script>
const KEY="horas_trabajo_v1";
let S={rate:7000,days:{},pays:[],exp:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const money=n=>"$"+Math.round(n).toLocaleString("es-CO");
const fh=n=>(Math.round(n*100)/100).toString().replace(".",",");
const dn=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const mn=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
let wk=monday(new Date());
$("f").value=iso(new Date());$("v").value=S.rate;

function render(){
  const l=$("l");l.innerHTML="";let th=0,tm=0;
  const end=new Date(wk);end.setDate(end.getDate()+6);
  $("t").textContent=wk.getDate()+" "+mn[wk.getMonth()]+" – "+end.getDate()+" "+mn[end.getMonth()]+" "+end.getFullYear();
  for(let i=0;i<7;i++){
    const d=new Date(wk);d.setDate(d.getDate()+i);const k=iso(d);const e=S.days[k];
    const row=document.createElement("div");row.className="day";
    const left=document.createElement("div");
    const b=document.createElement("b");b.textContent=dn[i];
    const sm=document.createElement("small");sm.textContent=d.getDate()+" "+mn[d.getMonth()];
    left.style.cursor="pointer";left.style.flex="1";left.onclick=()=>pick(k,e);
    left.append(b,sm);
    const right=document.createElement("div");right.className="r";
    if(e){
      th+=e.h;tm+=e.h*e.r;
      right.innerHTML="";
      const a=document.createElement("b");a.textContent=e.rest?"😴":money(e.h*e.r);
      const c=document.createElement("small");c.textContent=e.rest?"Descanso":fh(e.h)+" h";
      const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","Borrar");
      x.onclick=async()=>{if(await askC("¿Borrar las horas del "+dn[i]+"?")){delete S.days[k];save();render()}};
      const w=document.createElement("div");w.append(a,c);
      const box=document.createElement("div");box.style.display="flex";box.style.alignItems="center";box.style.gap="6px";
      box.append(w,x);right.append(box);
    }else{const z=document.createElement("span");z.className="zero";z.textContent="—";right.append(z)}
    row.append(left,right);l.append(row);
  }
  $("th").textContent="Total: "+fh(th)+" h";$("tm").textContent=money(tm);
  renderPay();
}
$("g").onclick=()=>{
  const f=$("f").value,h=parseFloat(String($("h").value).replace(",",".")),v=parseFloat($("v").value);
  const rest=$("rest").checked;
  if(!f||(!rest&&(isNaN(h)||h<0))||isNaN(v)){$("m").textContent="Revisa el día, las horas y el valor.";return}
  S.rate=v;S.days[f]=rest?{h:0,r:v,rest:true}:{h:h,r:v};save();
  $("m").textContent=rest?"✓ Descanso guardado":"✓ Guardado: "+fh(h)+" h = "+money(h*v);
  $("h").value="";$("rest").checked=false;$("h").disabled=false;wk=monday(parse(f));render();
};
$("a").onclick=()=>{wk.setDate(wk.getDate()-7);render()};
$("s").onclick=()=>{wk.setDate(wk.getDate()+7);render()};
$("pf").value=iso(new Date());
$("rest").onchange=()=>{$("h").disabled=$("rest").checked;if($("rest").checked)$("h").value=""};
function pick(k,e){
  const d=parse(k);
  $("f").value=k;syncDel();$("rest").checked=!!(e&&e.rest);$("h").disabled=$("rest").checked;
  $("h").value=(e&&!e.rest)?e.h:"";
  if(e)$("v").value=e.r;
  $("m").textContent=(e?"Editando ":"Registrando ")+dn[(d.getDay()+6)%7]+" "+d.getDate()+" de "+mn[d.getMonth()];
  window.scrollTo({top:0,behavior:"smooth"});
  if(!$("rest").checked)setTimeout(()=>$("h").focus(),350);
}
function askC(text){
  return new Promise(res=>{
    const o=document.createElement("div");
    o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";
    const b=document.createElement("div");
    b.style.cssText="background:var(--card);color:var(--tx);border-radius:14px;padding:18px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.4)";
    const p=document.createElement("div");p.textContent=text;p.style.cssText="font-size:1.05rem;margin-bottom:16px";
    const r=document.createElement("div");r.style.cssText="display:flex;gap:10px";
    const no=document.createElement("button");no.textContent="Cancelar";no.style.cssText="flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)";
    const si=document.createElement("button");si.textContent="Sí, continuar";si.style.cssText="flex:1;background:var(--dg);color:#fff;font-weight:600";
    const fin=v=>{o.remove();res(v)};
    no.onclick=()=>fin(false);si.onclick=()=>fin(true);
    r.append(no,si);b.append(p,r);o.append(b);document.body.append(o);
  });
}
function syncDel(){$("gd").hidden=!S.days[$("f").value]}
$("f").onchange=syncDel;
$("gd").onclick=async()=>{
  const k=$("f").value;
  if(S.days[k]&&await askC("¿Borrar el registro de este día?")){
    delete S.days[k];save();$("h").value="";$("rest").checked=false;$("h").disabled=false;
    $("m").textContent="✓ Día borrado";render();
  }
};
const VT={v1:"⏱️ Mis Horas de Trabajo",v2:"💸 Mis Gastos",v3:"🛟 Copia de seguridad"};
function show(v){
  for(const k in VT)$(k).hidden=k!==v;
  $("ttl").textContent=VT[v];$("mn").hidden=true;
  document.querySelectorAll("#mn button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  window.scrollTo(0,0);
}
$("mb").onclick=e=>{e.stopPropagation();$("mn").hidden=!$("mn").hidden};
document.querySelectorAll("#mn button").forEach(b=>b.onclick=()=>show(b.dataset.v));
document.addEventListener("click",()=>{$("mn").hidden=true});
const CATS=[["🍽️","Comida"],["🚌","Transporte"],["🏠","Hogar"],["💊","Salud"],["🎉","Ocio"],["📦","Otros"]];
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let cat="Otros",ew=new Date();ew.setDate(1);ew.setHours(0,0,0,0);
const sgn=n=>(n<0?"-":"")+money(Math.abs(n));
$("ef").value=iso(new Date());
function drawChips(){
  const c=$("ec");c.innerHTML="";
  CATS.forEach(([ic,nm])=>{const b=document.createElement("button");b.type="button";b.textContent=ic+" "+nm;if(nm===cat)b.className="on";b.onclick=()=>{cat=nm;drawChips()};c.append(b)});
}
function renderExp(){
  let paid=0,sp=0;S.pays.forEach(p=>paid+=p.m);S.exp.forEach(x=>sp+=x.m);
  const queda=paid-sp;
  $("xp").textContent=money(paid);$("xg").textContent=money(sp);
  $("xd").textContent=sgn(queda);$("xl").textContent=queda>=0?"Te queda":"Te falta";
  const key=ew.getFullYear()+"-"+String(ew.getMonth()+1).padStart(2,"0");
  $("et").textContent=MES[ew.getMonth()]+" "+ew.getFullYear();
  const list=S.exp.filter(x=>x.d.startsWith(key)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  let tot=0;list.forEach(x=>tot+=x.m);$("emt").textContent=money(tot);
  const l=$("el");l.innerHTML="";
  if(!list.length){const z=document.createElement("div");z.className="zero";z.style.padding="10px 0";z.textContent="Sin gastos este mes";l.append(z)}
  list.forEach(x=>{
    const d=parse(x.d),ic=(CATS.find(c=>c[0]&&c[1]===x.c)||CATS[5])[0];
    const row=document.createElement("div");row.className="day";
    const lf=document.createElement("div");
    const b=document.createElement("b");b.textContent=ic+" "+(x.n||x.c);
    const sm=document.createElement("small");sm.textContent=d.getDate()+" "+mn[d.getMonth()]+" · "+x.c;
    lf.append(b,sm);
    const rt=document.createElement("div");rt.style.cssText="display:flex;align-items:center;gap:6px";
    const a=document.createElement("b");a.textContent=money(x.m);
    const xb=document.createElement("button");xb.className="x";xb.textContent="✕";xb.setAttribute("aria-label","Borrar gasto");
    xb.onclick=async()=>{if(await askC("¿Borrar este gasto de "+money(x.m)+"?")){S.exp=S.exp.filter(q=>q.id!==x.id);save();renderExp()}};
    rt.append(a,xb);row.append(lf,rt);l.append(row);
  });
}
$("eg").onclick=()=>{
  const f=$("ef").value,m=parseFloat($("em").value);
  if(!f||isNaN(m)||m<=0){$("emsg").textContent="Revisa la fecha y el monto.";return}
  S.exp.push({id:Date.now(),d:f,m:m,c:cat,n:$("en").value.trim()});save();
  $("emsg").textContent="✓ Gasto guardado: "+money(m);
  $("em").value="";$("en").value="";
  const d=parse(f);ew=new Date(d.getFullYear(),d.getMonth(),1);renderExp();
};
$("ea").onclick=()=>{ew.setMonth(ew.getMonth()-1);renderExp()};
$("es").onclick=()=>{ew.setMonth(ew.getMonth()+1);renderExp()};
drawChips();show("v1");
let DL=null;
(async()=>{
  try{DL=await claude.use("downloads")}catch(e){}
  if(!DL)DL={save:async({filename,data})=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download=filename;document.body.append(a);a.click();a.remove();
    return {status:"saved"};
  }};
})();
function ageMsg(){
  const el=$("bage");const has=Object.keys(S.days).length||S.pays.length;
  if(!S.lb){el.textContent=has?"⚠️ Aún no has guardado ninguna copia.":"";return}
  const d=Math.floor((Date.now()-S.lb)/864e5);
  el.textContent=(d>=7?"⚠️ ":"✓ ")+"Última copia: "+(d===0?"hoy":"hace "+d+(d===1?" día":" días"));
}
$("bf").onclick=async()=>{
  const data=JSON.stringify({v:1,S:S});
  $("bmsg").textContent="Preparando la copia...";
  if(!DL){$("bk").click();$("bmsg").textContent="Aquí no se pueden guardar archivos: copia este texto y guárdalo en tus notas.";return}
  try{
    await DL.save({filename:"horas-"+iso(new Date())+".json",data:data});
    S.lb=Date.now();save();ageMsg();$("bmsg").textContent="✓ Copia guardada en tu teléfono";
  }catch(e){if(!e||e.code!=="declined")$("bmsg").textContent="No se pudo guardar el archivo. Prueba con la copia en texto."}
};
$("bfile").onchange=async()=>{
  const f=$("bfile").files[0];if(!f)return;
  try{
    const n=JSON.parse(await f.text()).S;
    if(!n||typeof n.days!=="object"||!Array.isArray(n.pays))throw 0;
    if(!(await askC("Esto reemplaza lo que hay ahora. ¿Continuar?")))return;
    S={rate:n.rate||7000,days:n.days,pays:n.pays,exp:Array.isArray(n.exp)?n.exp:[],lb:Date.now()};save();$("v").value=S.rate;render();ageMsg();
    $("bmsg").textContent="✓ Copia restaurada";
  }catch(err){$("bmsg").textContent="Ese archivo no parece una copia de esta página."}
  $("bfile").value="";
};
ageMsg();
$("bk").onclick=()=>{
  const t=$("bt");t.value=JSON.stringify({v:1,S:S});t.hidden=false;t.focus();t.select();
  $("bmsg").textContent="Copia lista: copia todo el texto y guárdalo (notas, WhatsApp, correo).";
  try{navigator.clipboard.writeText(t.value).then(()=>{$("bmsg").textContent="✓ Copia lista y ya copiada. Pégala en tus notas o en WhatsApp."}).catch(()=>{})}catch(e){}
};
$("rs").onclick=async()=>{
  const t=$("bt");
  try{
    const n=JSON.parse(t.value.trim()).S;
    if(!n||typeof n.days!=="object"||!Array.isArray(n.pays))throw 0;
    if(!(await askC("Esto reemplaza lo que hay ahora. ¿Continuar?")))return;
    S={rate:n.rate||7000,days:n.days,pays:n.pays,exp:Array.isArray(n.exp)?n.exp:[]};save();$("v").value=S.rate;render();
    $("bmsg").textContent="✓ Copia restaurada";t.value="";t.hidden=true;
  }catch(err){$("bmsg").textContent="Pega primero el texto completo de tu copia y toca Restaurar.";t.hidden=false}
};
function renderPay(){
  let earned=0;for(const k in S.days)earned+=S.days[k].h*S.days[k].r;
  let paid=0;S.pays.forEach(p=>paid+=p.m);
  const bal=earned-paid;
  renderExp();syncDel();$("ge").textContent=money(earned);$("gp").textContent=money(paid);
  $("gs").textContent=money(Math.abs(bal));
  $("gl").textContent=bal>=0?"Te deben":"Pagado de más";
  const l=$("pl");l.innerHTML="";
  S.pays.slice().sort((a,b)=>b.d.localeCompare(a.d)).forEach(p=>{
    const d=parse(p.d);
    const row=document.createElement("div");row.className="day";
    const left=document.createElement("div");
    const b=document.createElement("b");b.textContent=money(p.m);
    const sm=document.createElement("small");sm.textContent="Pago del "+d.getDate()+" "+mn[d.getMonth()]+" "+d.getFullYear();
    left.append(b,sm);
    const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","Borrar pago");
    x.onclick=async()=>{if(await askC("¿Borrar este pago de "+money(p.m)+"?")){S.pays=S.pays.filter(q=>q.id!==p.id);save();renderPay()}};
    row.append(left,x);l.append(row);
  });
}
$("pg").onclick=()=>{
  const f=$("pf").value,m=parseFloat($("pm").value);
  if(!f||isNaN(m)||m<=0){$("pmsg").textContent="Revisa la fecha y el monto.";return}
  S.pays.push({id:Date.now(),d:f,m:m});save();
  $("pmsg").textContent="✓ Pago registrado: "+money(m);
  $("pm").value="";renderPay();
};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
